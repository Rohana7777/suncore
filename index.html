<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suncore - BMS Monitor</title>
    <!-- MQTT Paho Library over WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0b0f12;
            --card-bg: #131a20;
            --accent-green: #00e676;
            --accent-orange: #ff9100;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-weight: bold;
        }

        .status-online { color: var(--accent-green); }
        .status-offline { color: #ff5252; }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .gauge-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .circle-gauge {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 12px solid var(--accent-green);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
        }

        .soc-text { font-size: 2.2rem; font-weight: bold; }
        .badge {
            background-color: rgba(255,255,255,0.08);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .status-banner {
            background-color: var(--accent-orange);
            color: #000;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .metric-box {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
        }

        .metric-val { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; }
        .metric-label { font-size: 0.8rem; color: var(--text-muted); }

        .cell-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .cell-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
        }

        .cell-num { color: var(--text-muted); font-size: 0.75rem; }
    </style>
</head>
<body>

    <!-- Header Status -->
    <div class="header-bar">
        <span>Cloud Status: <span id="cloudStatus" class="status-offline">CONNECTING...</span></span>
    </div>

    <!-- Central Gauges -->
    <div class="gauge-container">
        <div class="circle-gauge">
            <div class="soc-text" id="socVal">--%</div>
            <div class="badge" id="totalVoltage">--V</div>
            <div class="badge" id="currentVal">--A</div>
        </div>
    </div>

    <!-- Live Sync Banner -->
    <div class="status-banner">
        Status: Live MQTT Cloud Sync
    </div>

    <!-- Sub Metrics -->
    <div class="grid-4">
        <div class="metric-box">
            <div class="metric-val" id="highCell" style="color: #ff5252;">--</div>
            <div class="metric-label">High Cell(V)</div>
        </div>
        <div class="metric-box">
            <div class="metric-val" id="lowCell" style="color: #ff5252;">--</div>
            <div class="metric-label">Low Cell(V)</div>
        </div>
        <div class="metric-box">
            <div class="metric-val" id="voltDiff" style="color: var(--accent-green);">--</div>
            <div class="metric-label">Volt.-Diff(V)</div>
        </div>
        <div class="metric-box">
            <div class="metric-val" id="balCurr" style="color: var(--accent-green);">--</div>
            <div class="metric-label">Bal.-Curr.(A)</div>
        </div>
    </div>

    <!-- Individual Cells Container -->
    <div class="card" style="margin-top:20px;">
        <div style="font-size:0.9rem; color: var(--text-muted);">16-Cell Individual Voltages</div>
        <div class="cell-grid" id="cellContainer">
            <!-- Dynamically populated -->
        </div>
    </div>

    <script>
        // --- HiveMQ Secure WebSocket Configuration ---
        const brokerHost = "broker.hivemq.com";
        const brokerPort = 8884;
        const topicLive  = "suncore/jk_bms/live_data";

        const clientId = "SuncoreWeb-" + Math.floor(Math.random() * 100000);
        const client = new Paho.MQTT.Client(brokerHost, Number(brokerPort), "/mqtt", clientId);

        // Populate initial 16 cell placeholders
        const cellContainer = document.getElementById('cellContainer');
        for (let i = 1; i <= 16; i++) {
            cellContainer.innerHTML += `
                <div class="cell-card">
                    <div class="cell-num">C${i}</div>
                    <div id="cell_${i}">--</div>
                </div>
            `;
        }

        client.onConnectionLost = function (responseObject) {
            console.warn("[MQTT] Connection lost:", responseObject.errorMessage);
            document.getElementById('cloudStatus').innerText = "OFFLINE";
            document.getElementById('cloudStatus').className = "status-offline";
            setTimeout(connectMQTT, 3000);
        };

        client.onMessageArrived = function (message) {
            console.log("[MQTT Payload Received]:", message.payloadString);
            try {
                const data = JSON.parse(message.payloadString);

                // Update core BMS metrics
                if (data.soc !== undefined)    document.getElementById('socVal').innerText       = data.soc + "%";
                if (data.totalV !== undefined) document.getElementById('totalVoltage').innerText = Number(data.totalV).toFixed(2) + "V";
                if (data.curr !== undefined)   document.getElementById('currentVal').innerText  = Number(data.curr).toFixed(2) + "A";

                // Update secondary metrics
                if (data.hi !== undefined)   document.getElementById('highCell').innerText = Number(data.hi).toFixed(3);
                if (data.lo !== undefined)   document.getElementById('lowCell').innerText  = Number(data.lo).toFixed(3);
                if (data.diff !== undefined) document.getElementById('voltDiff').innerText = Number(data.diff).toFixed(3);
                if (data.bal !== undefined)  document.getElementById('balCurr').innerText  = Number(data.bal).toFixed(3);

                // Update 16 individual cell voltages
                if (Array.isArray(data.cells)) {
                    data.cells.forEach((val, idx) => {
                        const cellElem = document.getElementById(`cell_${idx + 1}`);
                        if (cellElem) cellElem.innerText = Number(val).toFixed(3) + "V";
                    });
                }
            } catch (err) {
                console.error("[MQTT Error] JSON parse error:", err);
            }
        };

        function connectMQTT() {
            console.log("[MQTT] Connecting to wss://broker.hivemq.com:8884/mqtt...");
            client.connect({
                useSSL: true,
                onSuccess: function () {
                    console.log("[MQTT] Connected to HiveMQ! Subscribing to:", topicLive);
                    document.getElementById('cloudStatus').innerText = "ONLINE";
                    document.getElementById('cloudStatus').className = "status-online";
                    client.subscribe(topicLive);
                },
                onFailure: function (err) {
                    console.error("[MQTT] Connect failed:", err);
                    document.getElementById('cloudStatus').innerText = "FAILED";
                    document.getElementById('cloudStatus').className = "status-offline";
                    setTimeout(connectMQTT, 3000);
                }
            });
        }

        connectMQTT();
    </script>
</body>
</html>
